# Enable I2C Subsystem
CONFIG_I2C=y

# Enable Console/Logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Enable floating-point formatting for printf (crucial for printing %f for gravity)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Standard C Library for math functions (sin, cos if needed) and standard types
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y