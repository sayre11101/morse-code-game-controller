# Enable the I2C Subsystem
CONFIG_I2C=y

# Enable the Emulator Subsystem (Required for EMUL_DT_DEFINE)
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

# Enable standard output and logging for the telemetry
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

# Enable floating-point formatting for printf (CRITICAL for %.2f)
CONFIG_CBPRINTF_FP_SUPPORT=y

# (Optional but recommended) Use a full C library for stable stdio.h / file I/O
CONFIG_NEWLIB_LIBC=y